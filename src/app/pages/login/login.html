<app-auth-shell
  [destaque]="['Grandes jogos.', 'Melhores escolhas.']"
  pergunta="Novo por aqui?"
  textoLink="Criar uma conta"
  rotaLink="/cadastro"
>
  <p class="sobretitulo mb-3">Bom ter você de volta</p>
  <h2 class="text-4xl font-extrabold mb-2">Entre no seu radar.</h2>
  <p class="text-radar-text-muted mb-8">
    Seus jogos favoritos e suas próximas oportunidades estão aqui.
  </p>

  <form [formGroup]="form" (ngSubmit)="entrar()" novalidate class="space-y-5">
    <div>
      <label for="email" class="rotulo">E-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="voce@exemplo.com"
        class="campo"
      />
      <app-campo-erro [controle]="form.controls.email" />
    </div>

    <div>
      <label for="senha" class="rotulo">Senha</label>
      <div class="relative">
        <input
          id="senha"
          [type]="senhaVisivel() ? 'text' : 'password'"
          formControlName="senha"
          autocomplete="current-password"
          placeholder="Digite sua senha"
          class="campo pr-20"
        />
        <button
          type="button"
          (click)="senhaVisivel.set(!senhaVisivel())"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-radar-text-muted hover:text-white"
        >
          {{ senhaVisivel() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      <app-campo-erro
        [controle]="form.controls.senha"
        [mensagens]="{ required: 'Informe sua senha.' }"
      />
    </div>

    <label class="flex items-center gap-2 text-sm text-radar-text-muted cursor-pointer w-fit">
      <input type="checkbox" formControlName="lembrar" class="w-4 h-4" />
      Lembrar de mim
    </label>

    @if (erro()) {
      <p
        class="text-sm text-red-400 border border-red-500/40 bg-red-500/10 rounded-lg px-4 py-3"
        role="alert"
      >
        {{ erro() }}
      </p>
    }

    <button type="submit" class="btn-primario w-full" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : '→ Entrar' }}
    </button>
  </form>

  <p class="text-xs text-radar-text-muted mt-8 border-t border-radar-border pt-6">
    🛡️ Não vendemos jogos. Ajudamos você a comparar preços e escolher onde comprar.
    <br />
    Conta de demonstração: joao&#64;radargamer.com · radar1234
  </p>
</app-auth-shell>
