<div class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-[#1A1D24] p-8 rounded-xl border border-[#2A2D35]">
    <h1 class="text-2xl font-bold text-white mb-6 text-center">Entrar no Radar Gamer</h1>
    <form class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">E-mail</label>
        <input
          type="email"
          class="w-full bg-[#0D0E12] border border-[#2A2D35] rounded-lg px-4 py-2 text-white focus:outline-none focus:border-[#CCFF00]"
          placeholder="seu@email.com"
        />
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Senha</label>
        <input
          type="password"
          class="w-full bg-[#0D0E12] border border-[#2A2D35] rounded-lg px-4 py-2 text-white focus:outline-none focus:border-[#CCFF00]"
          placeholder="••••••••"
        />
      </div>
      <button
        type="button"
        class="w-full bg-[#CCFF00] text-black font-semibold py-2 rounded-lg hover:bg-[#b3e600] transition-colors mt-4"
      >
        Entrar
      </button>
    </form>
    <p class="text-center text-sm text-gray-400 mt-6">
      Não tem uma conta?
      <a routerLink="/cadastro" class="text-[#CCFF00] hover:underline">Cadastre-se</a>
    </p>
  </div>
</div>
