<app-auth-shell
  [destaque]="['Menos no preço.', 'Mais na sua biblioteca.']"
  pergunta="Já tem uma conta?"
  textoLink="Entrar"
  rotaLink="/login"
>
  <p class="sobretitulo mb-3">Comece a economizar</p>
  <h2 class="text-4xl font-extrabold mb-2">Ative o seu radar.</h2>
  <p class="text-radar-text-muted mb-8">
    Crie sua conta gratuita e acompanhe os jogos que você quer de verdade.
  </p>

  <form [formGroup]="form" (ngSubmit)="cadastrar()" novalidate class="space-y-4">
    <div>
      <label for="nome" class="rotulo">Nome completo</label>
      <input
        id="nome"
        formControlName="nome"
        autocomplete="name"
        placeholder="Como você se chama?"
        class="campo"
      />
      <app-campo-erro [controle]="form.controls.nome" />
    </div>

    <div>
      <label for="email" class="rotulo">E-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="voce@exemplo.com"
        class="campo"
      />
      <app-campo-erro
        [controle]="form.controls.email"
        [mensagens]="{ emailEmUso: 'Este e-mail já está cadastrado. Que tal entrar?' }"
      />
    </div>

    <div>
      <label for="senha" class="rotulo">Senha</label>
      <div class="relative">
        <input
          id="senha"
          [type]="senhaVisivel() ? 'text' : 'password'"
          formControlName="senha"
          autocomplete="new-password"
          placeholder="Crie uma senha"
          class="campo pr-20"
        />
        <button
          type="button"
          (click)="senhaVisivel.set(!senhaVisivel())"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-radar-text-muted hover:text-white"
        >
          {{ senhaVisivel() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      <p class="text-xs text-radar-text-muted mt-1.5">
        Use pelo menos 8 caracteres, com letras e números.
      </p>
      <app-campo-erro
        [controle]="form.controls.senha"
        [mensagens]="{ pattern: 'A senha precisa ter 8 caracteres ou mais, com letras e números.' }"
      />
    </div>

    <div>
      <label for="confirmar" class="rotulo">Confirmar senha</label>
      <input
        id="confirmar"
        [type]="senhaVisivel() ? 'text' : 'password'"
        formControlName="confirmarSenha"
        autocomplete="new-password"
        placeholder="Repita sua senha"
        class="campo"
        [class.border-red-500/70]="
          form.hasError('senhasDiferentes') && form.controls.confirmarSenha.touched
        "
      />
      <app-campo-erro
        [controle]="form.controls.confirmarSenha"
        [mensagens]="{ required: 'Repita a senha.' }"
      />
      <app-campo-erro
        [controle]="form"
        [mensagens]="{ senhasDiferentes: 'As senhas não são iguais.' }"
      />
    </div>

    <div>
      <label class="flex items-center gap-2 text-sm text-radar-text-muted cursor-pointer">
        <input type="checkbox" formControlName="termos" class="w-4 h-4" />
        Li e aceito os Termos de uso e a Política de privacidade.
      </label>
      <app-campo-erro
        [controle]="form.controls.termos"
        [mensagens]="{ required: 'Você precisa aceitar os termos para continuar.' }"
      />
    </div>

    @if (erro()) {
      <p
        class="text-sm text-red-400 border border-red-500/40 bg-red-500/10 rounded-lg px-4 py-3"
        role="alert"
      >
        {{ erro() }}
      </p>
    }

    <button type="submit" class="btn-primario w-full" [disabled]="enviando()">
      {{ enviando() ? 'Criando conta…' : '→ Criar minha conta' }}
    </button>
  </form>

  <p class="text-xs text-radar-text-muted text-center mt-6">
    Sua lista de desejos e seus alertas em um só lugar.
  </p>
</app-auth-shell>
